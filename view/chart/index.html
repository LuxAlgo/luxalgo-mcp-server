<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vela chart</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #131722;
        --muted: #6a6d78;
        --line: #e0e3eb;
        --btn: #f0f3fa;
        color-scheme: light;
      }
      :root[data-theme="dark"] {
        --bg: #0f1116;
        --fg: #d1d4dc;
        --muted: #8b8f9a;
        --line: #2a2e39;
        --btn: #1e222d;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.3 system-ui, sans-serif; }
      body { display: flex; flex-direction: column; height: 520px; }
      :root[data-display-mode="fullscreen"] body, :root[data-display-mode="pip"] body { height: 100vh; }
      header { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
      #title { font-weight: 600; }
      #status { color: var(--muted); margin-inline-end: auto; }
      #note { color: var(--muted); font-size: 12px; }
      button { background: var(--btn); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; font: inherit; cursor: pointer; }
      button:disabled { opacity: 0.45; cursor: default; }
      #ask { background: #2962ff; border-color: #2962ff; color: #fff; }
      #chart { flex: 1; min-height: 0; position: relative; }
    </style>
  </head>
  <body>
    <header>
      <span id="title">Vela chart</span>
      <span id="status">Connecting</span>
      <span id="note" role="status" hidden></span>
      <button id="ask" hidden>Ask about this</button>
      <button id="open">Open in Vela</button>
      <button id="fullscreen">Full screen</button>
      <button id="pip">Picture in picture</button>
    </header>
    <div id="chart"></div>
    <script type="module">
      /*__BUNDLE__*/
    </script>
  </body>
</html>
