<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vela chart</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #131722;
        --muted: #6a6d78;
        --line: #e0e3eb;
        --btn: #f0f3fa;
        color-scheme: light;
      }
      :root[data-theme="dark"] {
        --bg: #0f1116;
        --fg: #d1d4dc;
        --muted: #8b8f9a;
        --line: #2a2e39;
        --btn: #1e222d;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.3 system-ui, sans-serif; }
      body { display: flex; flex-direction: column; height: 520px; position: relative; }
      :root[data-display-mode="fullscreen"] body, :root[data-display-mode="pip"] body { height: 100vh; }
      header { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
      #title { font-weight: 600; }
      #status { color: var(--muted); margin-inline-end: auto; }
      #note { position: absolute; top: 46px; inset-inline-end: 10px; z-index: 5; max-width: min(70%, 520px); background: var(--btn); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.25); }
      #note small { display: block; color: var(--muted); margin-top: 2px; }
      button { background: var(--btn); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; font: inherit; cursor: pointer; }
      button:disabled { opacity: 0.45; cursor: default; }
      #ask { background: #2962ff; border-color: #2962ff; color: #fff; }
      #chart { flex: 1; min-height: 0; position: relative; }
      /* "More markets on Vela" in the symbol search (main.ts): one quiet line, never a banner. */
      .lux-more-footer, .lux-more-empty { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
      .lux-more-footer { flex: none; padding: 8px 16px 14px; border-top: 1px solid var(--line); }
      .lux-more-footer[hidden] { display: none; }
      .lux-more-empty { margin-top: 12px; }
      .lux-more-open { font-size: 12px; padding: 3px 10px; }
    </style>
  </head>
  <body>
    <header>
      <span id="title">Vela chart</span>
      <span id="status">Connecting</span>
      <button id="ask" hidden>Ask about this</button>
      <button id="open">Open in Vela</button>
      <button id="fullscreen">Full screen</button>
      <button id="pip">Picture in picture</button>
    </header>
    <div id="note" role="status" hidden></div>
    <div id="chart"></div>
    <script type="module">
      /*__BUNDLE__*/
    </script>
  </body>
</html>
