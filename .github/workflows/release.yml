name: Release

# Publishes @luxalgo/mcp to npm with provenance when a GitHub release is
# published. Requires the NPM_TOKEN repository secret (an npm automation
# token with publish rights on @luxalgo/mcp).
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm --provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
